version: "3.9"

services:
  devopsdb:
    image: anilrentikota/automation:db
    networks:
      - mynetwork
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  application:
    image: anilrentikota/automation:app
    ports:
      - target: 8080
        published: 1111
        protocol: tcp
        mode: ingress
    networks:
      - mynetwork
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

networks:
  mynetwork:
    driver: overlay
